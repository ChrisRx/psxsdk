<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>psxsdk playground</title>
  <meta name="description" content="Write a PlayStation program in Go, build it in the browser with TinyGo compiled to WebAssembly, and run it in an emulator written in Go.">
  <meta name="theme-color" content="#e3e2dd" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1b1e" media="(prefers-color-scheme: dark)">
  <link rel="preload" href="fonts/barlow-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/barlow-500.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body class="playground">
  <header class="pg-top">
    <h1>psxsdk playground</h1>
    <button id="run" class="primary" type="button" title="Format, build and run (Ctrl+Enter)">Run</button>
    <button id="format" type="button" title="Format the program with gofmt (Ctrl+Shift+F)">Format</button>
    <button id="revert" type="button" title="Replace the program with the one the playground starts with">Start over</button>
    <span class="pg-hint muted"><kbd>Ctrl</kbd> <kbd>Enter</kbd> runs, <kbd>Ctrl</kbd> <kbd>Space</kbd> completes</span>
    <div class="pg-links">
      <a href="../examples/">Examples</a>
      <a href="../">Documentation</a>
      <a href="https://github.com/ChrisRx/psxsdk">GitHub</a>
    </div>
  </header>

  <main id="pg" class="pg">
    <section class="pg-code" aria-label="Program">
      <div id="editor"></div>
      <details id="assets" class="pg-assets">
        <summary>Data files <span id="asset-count" class="muted"></span></summary>
        <div class="pg-assets-bar">
          <button id="add-assets" class="small-button" type="button" title="Add files from this computer under data/, as the program registers them">Add files…</button>
          <input id="asset-files" type="file" multiple hidden>
          <select id="example-data" aria-label="Add an example's data files" disabled>
            <option value="">Add an example's data…</option>
          </select>
          <button id="clear-assets" class="small-button" type="button" hidden>Remove all</button>
          <span id="asset-status" class="muted" aria-live="polite">Files dropped on the editor are added too.</span>
        </div>
        <ul id="asset-list" class="pg-assets-list"></ul>
      </details>
    </section>

    <div id="split" class="pg-split" role="separator" aria-orientation="vertical" aria-label="Resize the editor" tabindex="0"></div>

    <section class="pg-side" aria-label="Emulator">
      <div id="stage" class="stage">
        <div class="screen" tabindex="0" aria-label="Emulator display; focus it to use the keyboard as the pad">
          <canvas id="screen" width="320" height="240"></canvas>
          <div id="overlay" class="overlay">Run the program to build it and start it here.</div>
          <button id="exit-full" class="exit-full" type="button" aria-label="Exit fullscreen">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12m0-12L6 18"/></svg>
          </button>
        </div>
      </div>

      <div class="bar">
        <button id="pause" type="button" disabled>Pause</button>
        <button id="reset" type="button" disabled>Reset</button>
        <button id="sound" type="button" aria-pressed="false">Mute</button>
        <button id="fullscreen" type="button">Fullscreen</button>
        <span id="status" class="status" aria-live="polite"></span>
      </div>

      <section class="pg-out out" aria-label="Output">
        <div class="tabs">
          <div role="tablist" aria-label="Output">
            <button id="tab-build" role="tab" type="button" aria-selected="true" aria-controls="build-log">Compiler</button>
            <button id="tab-tty" role="tab" type="button" aria-selected="false" aria-controls="tty" tabindex="-1">Emulator</button>
          </div>
          <span id="build-status" class="status" aria-live="polite"></span>
          <label class="level" hidden title="What the emulator logs besides what the program prints. error: crashes; warn: accesses to unmapped addresses; info: display changes; debug: BIOS calls and CD-ROM commands; trace: DMA, events and system calls.">Log
            <select id="log-level">
              <option value="off">off</option>
              <option value="error">error</option>
              <option value="warn">warn</option>
              <option value="info" selected>info</option>
              <option value="debug">debug</option>
              <option value="trace">trace</option>
            </select>
          </label>
          <button id="clear-tty" class="small-button" type="button" hidden>Clear</button>
        </div>
        <pre id="build-log" class="log" role="tabpanel" aria-labelledby="tab-build"></pre>
        <pre id="tty" class="log" role="tabpanel" aria-labelledby="tab-tty" hidden></pre>
      </section>
    </section>
  </main>

  <script src="app.js"></script>
  <script src="editor.js"></script>
  <script src="assets.js"></script>
  <script src="playground.js"></script>
</body>
</html>

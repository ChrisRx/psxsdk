name: Pages

# Builds the site, every example's disc, the emulator and the playground,
# and publishes it through the gh-pages branch, which only this workflow
# writes to and which GitHub Pages serves. The playground's compiler comes
# from the cache or the release the Compiler workflow fills, and is never
# built here: when both miss, the Compiler workflow is building it, so a
# push to main skips the deploy, which would drop the playground, and the
# Compiler workflow runs this one again once it has published the
# compiler. A pull request builds the site without the playground then.
# A push to main deploys the site to the root. A pull
# request builds the site, which catches a change that breaks an example,
# and when it touches the site also deploys a preview to pr-preview/pr-N/
# and comments the preview's address on the pull request. The preview is
# removed when the pull request closes.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [ opened, reopened, synchronize, closed ]
  workflow_dispatch:

jobs:

  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      site: ${{ steps.changes.outputs.site }}
      compiler: ${{ steps.compiler.outputs.found }}
    steps:
    - uses: actions/checkout@v4

    - name: Check for changes to the site
      id: changes
      if: github.event_name == 'pull_request'
      uses: dorny/paths-filter@v3
      with:
        filters: |
          site:
            - 'docs/**'
            - 'examples/**'
            - 'web/**'

    - name: Install Nix
      uses: cachix/install-nix-action@v31

    - name: Cache Nix store
      uses: DeterminateSystems/magic-nix-cache-action@v8

    # The examples' discs are built in parallel, each by a compiler of its
    # own, which on a runner of a few cores and 28 at once is a crawl, so
    # no more run at once than there are cores.
    - name: Build site
      run: nix develop .#site --command task -C "$(nproc)" site

    - name: Get the playground's compiler
      id: compiler
      uses: ./.github/actions/compiler
      with:
        build: false

    - name: Build playground
      if: steps.compiler.outputs.found == 'true'
      run: nix develop .#playground --command task playground

    - name: Upload site
      uses: actions/upload-artifact@v4
      with:
        name: site
        path: .build/site
        include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request' && needs.build.outputs.compiler == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Writes to gh-pages are serialized with the preview job's, so two runs
    # never push over each other.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v4

    - name: Download site
      uses: actions/download-artifact@v4
      with:
        name: site
        path: site

    - name: Deploy to gh-pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: site
        branch: gh-pages
        clean: true
        clean-exclude: pr-preview/**
        force: false

  preview:
    # Runs for a pull request from this repository that changed an example,
    # and for any pull request closing, to remove its preview if it has one.
    # A pull request from a fork has no permission to push, so none is
    # attempted for it. The build job is skipped on close, which is what
    # !cancelled() lets through.
    if: >-
      !cancelled()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && (github.event.action == 'closed' || needs.build.outputs.site == 'true')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v4

    - name: Download site
      if: github.event.action != 'closed'
      uses: actions/download-artifact@v4
      with:
        name: site
        path: site

    - name: Deploy preview
      uses: rossjrw/pr-preview-action@v1
      with:
        source-dir: site
        preview-branch: gh-pages
        umbrella-dir: pr-preview
        action: auto

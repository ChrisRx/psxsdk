name: Pages

# Builds the site, every example's disc, the emulator and the playground,
# and publishes it to GitHub Pages as this workflow's artifact. The
# playground's compiler is the one yaroze embeds, cmd/yaroze/wasm/
# tinygo.wasm.gz, and the compiled C and assembly in its sysroot's cache
# come from the sysroot embedded beside it, so the checkout is all this
# needs: no compiler is built or downloaded here, and the Compiler workflow
# is for making those files when the recipe changes. A push to main
# deploys the site. A pull request only builds it, which catches a change
# that breaks an example.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v4

    - name: Install Nix
      uses: cachix/install-nix-action@v31

    - name: Cache Nix store
      uses: DeterminateSystems/magic-nix-cache-action@v8

    # The examples' discs are built in parallel, each by a compiler of its
    # own, which on a runner of a few cores and 28 at once is a crawl, so
    # no more run at once than there are cores.
    - name: Build site
      run: nix develop .#site --command task -C "$(nproc)" site

    # The sysroot is gathered from the patched TinyGo tree, which is the
    # compiler's source rather than the compiler, and is made from the
    # flake's TinyGo in a minute.
    - name: Prepare the TinyGo tree
      env:
        OUT: ${{ github.workspace }}/.build/compiler
      run: |
        rev=$(sed -n 's#.*"rev": *"\([0-9a-f]\{40\}\)".*#\1#p' flake.lock | head -1)
        NIXPKGS="github:NixOS/nixpkgs/$rev" web/compiler/prepare.sh

    - name: Build playground
      run: nix develop .#playground --command task -C "$(nproc)" playground

    - name: Upload site
      if: github.event_name != 'pull_request'
      uses: actions/upload-pages-artifact@v3
      with:
        path: .build/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # A deployment in progress finishes before the next one starts.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

# Builds the playground's compiler, TinyGo compiled to WebAssembly with LLVM
# linked in, caches it for the Pages workflow and publishes it as a release
# (web/compiler/release.sh). The Pages workflow downloads the release when
# its cache misses, and builds the compiler itself only when there is no
# release either. It takes a couple of hours, so it runs when the recipe or
# the TinyGo fork's revision changes, or by hand, rather than on every
# push. A recipe whose release exists already is downloaded, not built.
name: Compiler

on:
  push:
    branches: [ "main" ]
    paths:
      - 'web/compiler/**'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/actions/compiler/**'
      - '.github/workflows/compiler.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Install Nix
      uses: cachix/install-nix-action@v31

    - name: Cache Nix store
      uses: DeterminateSystems/magic-nix-cache-action@v8

    - name: Build the compiler
      uses: ./.github/actions/compiler

    - name: Publish the compiler
      env:
        GH_TOKEN: ${{ github.token }}
        TARGET: ${{ github.sha }}
      run: web/compiler/release.sh .build/compiler

# Builds the playground's compiler, TinyGo compiled to WebAssembly with LLVM
# linked in, caches it and publishes it to R2 (web/compiler/release.sh), named
# by the recipe's key. It takes a couple of hours, so it runs when the recipe,
# TinyGo's revision or the PlayStation files laid over it change, or by hand,
# rather than on every push, and a recipe already on R2, which a local build
# published first, is downloaded, not built.
#
# The site does not wait on it: the Pages workflow builds the playground
# with the compiler yaroze embeds, cmd/yaroze/wasm/tinygo.wasm.gz. A
# compiler published here is what task yaroze refreshes that from, by hand,
# with the embedded sysroot, after which the next push carries the new
# compiler to the site and to go run alike.
name: Compiler

on:
  push:
    branches: [ "main" ]
    paths:
      - 'web/compiler/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'internal/toolchain/_tinygo/**'
      - 'internal/toolchain/tinygo-*.patch'
      - '.github/actions/compiler/**'
      - '.github/workflows/compiler.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: write
    steps:
    - uses: actions/checkout@v4

    - name: Install Nix
      uses: cachix/install-nix-action@v31

    - name: Cache Nix store
      uses: DeterminateSystems/magic-nix-cache-action@v8

    - name: Build the compiler
      id: compiler
      uses: ./.github/actions/compiler

    - name: Publish the compiler
      env:
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        NO_MANIFEST: 1
      run: web/compiler/release.sh .build/compiler


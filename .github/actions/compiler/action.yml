name: Compiler for the playground
description: >-
  Puts the playground's compiler, TinyGo compiled to WebAssembly, in
  .build/compiler: from the cache when the recipe has not changed, then
  from the release named by its key, and built otherwise, which takes a
  couple of hours. Leaves the patched TinyGo tree in .build/compiler/tinygo,
  which the playground task needs as well. Nix must be installed already.
inputs:
  build:
    description: >-
      Whether to build the compiler when neither the cache nor a release has
      it. The Pages workflow passes false and leaves the build to the
      Compiler workflow, which would otherwise be doing the same build at
      the same time.
    default: 'true'
outputs:
  key:
    description: The compiler's key (web/compiler/key.sh), which names its cache entry and release.
    value: ${{ steps.key.outputs.key }}
  found:
    description: Whether .build/compiler has the compiler, from the cache, a release or a build.
    value: ${{ steps.result.outputs.found }}
  built:
    description: Whether the compiler was built here rather than found.
    value: ${{ steps.result.outputs.built }}
runs:
  using: composite
  steps:
  - name: Find the TinyGo fork's revision
    id: fork
    shell: bash
    run: echo "rev=$(sed -n 's/.*rev = "\([0-9a-f]\{40\}\)".*/\1/p' flake.nix | head -1)" >> "$GITHUB_OUTPUT"

  - name: Check out the TinyGo fork
    uses: actions/checkout@v4
    with:
      repository: ChrisRx/tinygo
      ref: ${{ steps.fork.outputs.rev }}
      path: tinygo

  - name: Check out wasi-libc
    shell: bash
    run: git -C tinygo submodule update --init --depth 1 lib/wasi-libc

  - name: Prepare the TinyGo tree
    shell: bash
    env:
      TINYGO_SRC: ${{ github.workspace }}/tinygo
      OUT: ${{ github.workspace }}/.build/compiler
    run: |
      rev=$(sed -n 's#.*"rev": *"\([0-9a-f]\{40\}\)".*#\1#p' flake.lock | head -1)
      NIXPKGS="github:NixOS/nixpkgs/$rev" web/compiler/prepare.sh

  - name: Find the compiler's key
    id: key
    shell: bash
    run: echo "key=$(web/compiler/key.sh)" >> "$GITHUB_OUTPUT"

  - name: Restore the compiler
    id: cache
    uses: actions/cache/restore@v4
    with:
      path: .build/compiler/*.wasm
      key: ${{ steps.key.outputs.key }}

  # The cache drops an entry nothing has used for a week, and a release
  # stays, so a miss looks there before building.
  - name: Download the compiler
    id: release
    if: steps.cache.outputs.cache-hit != 'true'
    shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      KEY: ${{ steps.key.outputs.key }}
    run: |
      if gh release download "$KEY" --repo "$GITHUB_REPOSITORY" --dir .build/compiler --pattern '*.wasm' --clobber; then
        echo "found=true" >> "$GITHUB_OUTPUT"
      else
        echo "No release $KEY; building the compiler."
      fi

  - name: Build the compiler
    id: build
    if: steps.cache.outputs.cache-hit != 'true' && steps.release.outputs.found != 'true' && inputs.build == 'true'
    shell: bash
    env:
      TINYGO_SRC: ${{ github.workspace }}/tinygo
      JOBS: 4
    run: web/compiler/build.sh .build/compiler

  - name: Note the compiler is missing
    if: steps.cache.outputs.cache-hit != 'true' && steps.release.outputs.found != 'true' && inputs.build != 'true'
    shell: bash
    env:
      KEY: ${{ steps.key.outputs.key }}
    run: echo "::notice::No compiler $KEY in the cache or a release, and this workflow does not build it; the Compiler workflow does."

  - name: Save the compiler
    if: steps.cache.outputs.cache-hit != 'true' && (steps.release.outputs.found == 'true' || steps.build.outcome == 'success')
    uses: actions/cache/save@v4
    with:
      path: .build/compiler/*.wasm
      key: ${{ steps.key.outputs.key }}

  - name: Report the result
    id: result
    shell: bash
    env:
      HIT: ${{ steps.cache.outputs.cache-hit == 'true' || steps.release.outputs.found == 'true' }}
      BUILT: ${{ steps.build.outcome == 'success' }}
    run: |
      if [ "$HIT" = true ] || [ "$BUILT" = true ]; then found=true; else found=false; fi
      echo "found=$found" >> "$GITHUB_OUTPUT"
      echo "built=$BUILT" >> "$GITHUB_OUTPUT"

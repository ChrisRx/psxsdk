version: '3'

tasks:
  test:
    cmds:
      - go vet ./...
      - go test $(go list ./... | grep -v examples)

  # Runs the example programs in the emulator, from the tests package. It
  # needs a BIOS, from PSX_BIOS or the OpenBIOS image the site ships, and
  # builds the discs with TinyGo, so it runs in the default dev shell rather
  # than the ci one. The memory card test drives Sony's shell, which OpenBIOS
  # does not have, and runs only with Sony's BIOS in PSX_SONY_BIOS.
  test:emu:
    cmds:
      - task: discs
      - task: disc:tutorial
      - PSX_BIOS="${PSX_BIOS:-$PWD/emu/openbios/openbios.bin}" PSX_DISCS="$PWD/.build" go test -v ./tests/...

  # Builds the check example onto .build/check/check.cue.
  disc:check:
    cmds:
      - task: disc
        vars: { NAME: check }

  # Builds every example's disc, each onto .build/NAME/NAME.cue: every
  # directory under examples with a main.go, since examples/internal holds
  # what they share and is not one.
  discs:
    vars:
      EXAMPLES:
        sh: for f in examples/*/main.go; do basename "$(dirname "$f")"; done
    cmds:
      - for: { var: EXAMPLES }
        task: disc
        vars: { NAME: '{{.ITEM}}' }

  # Builds the program in DIR, examples/NAME unless told otherwise, onto
  # .build/NAME/NAME.cue, with the files it registers, which mkpsxiso reads
  # out of the executable and takes from DIR. The output directory starts
  # with a dot so that go list ./... leaves it alone. The build optimizes
  # for speed, OPT=2, since a game's frame has a budget; OPT=z is TinyGo's
  # own default, for size.
  disc:
    requires:
      vars: [NAME]
    vars:
      DIR: '{{.DIR | default (printf "examples/%s" .NAME)}}'
      OPT: '{{.OPT | default "2"}}'
    cmds:
      - rm -rf .build/{{.NAME}}
      - mkdir -p .build/{{.NAME}}
      - tinygo build -opt={{.OPT}} -target=playstation-yaroze -o .build/{{.NAME}}/prog.elf ./{{.DIR}}
      - go tool mips1fix .build/{{.NAME}}/prog.elf
      - go tool eco2exe .build/{{.NAME}}/prog.elf .build/{{.NAME}}/prog.exe
      - go tool mkpsxiso -o .build/{{.NAME}}/{{.NAME}}.bin --volume-id {{.NAME}}.exe --boot MAIN.EXE --file MAIN.EXE=.build/{{.NAME}}/prog.exe --src {{.DIR}}

  # Builds the tutorial's first program onto .build/hello/hello.cue, so
  # that it runs on its page like the examples and in the emulator tests.
  # The rest of the tutorial writes the square example.
  disc:tutorial:
    cmds:
      - task: disc
        vars: { NAME: hello, DIR: docs/tutorial/hello }

  # Builds the program in DIR, examples/NAME unless told otherwise, onto a
  # disc and runs it in a window with psxplay, booting OpenBIOS. Flags
  # after -- go to psxplay: task play NAME=check -- --mute
  play:
    requires:
      vars: [NAME]
    vars:
      DIR: '{{.DIR | default (printf "examples/%s" .NAME)}}'
    cmds:
      - task: disc
        vars: { NAME: '{{.NAME}}', DIR: '{{.DIR}}' }
      - go run ./tools/psxplay {{.CLI_ARGS}} .build/{{.NAME}}/{{.NAME}}.cue

  # Builds the site into .build/site, replacing what is there: the
  # documentation from docs/ and the examples' package comments, rendered
  # by web/site, and under play/ the playground and the player from
  # web/static, the yaroze.json the playground's completion reads, also
  # written by web/site, the OpenBIOS image the examples boot with from
  # emu/openbios, every example's disc and the tutorial's, and the emulator
  # compiled to WebAssembly from web/.
  # Sony's BIOS must never be copied in.
  #
  # .github/workflows/pages.yml publishes this directory to GitHub Pages
  # through the gh-pages branch, so it is never committed here. The
  # .nojekyll file keeps Pages from running the branch through Jekyll.
  site:
    vars:
      SITE: .build/site
      PLAY: .build/site/play
      EXAMPLES:
        # Every directory under examples with a main.go; examples/internal
        # holds what they share, and is not one. The tutorial's first
        # program joins them.
        sh: for f in examples/*/main.go; do basename "$(dirname "$f")"; done; echo hello
    cmds:
      - task: discs
      - task: disc:tutorial
      - rm -rf {{.SITE}}
      - go run ./web/site -out {{.SITE}}
      - cp emu/openbios/openbios.bin emu/openbios/OPENBIOS-LICENSE.txt {{.PLAY}}/
      - mkdir -p {{.PLAY}}/examples
      # Each example's disc, and its data files as well, which the
      # playground offers to start a program from.
      - for: { var: EXAMPLES }
        cmd: |
          mkdir -p {{.PLAY}}/examples/{{.ITEM}}
          cp .build/{{.ITEM}}/{{.ITEM}}.cue .build/{{.ITEM}}/{{.ITEM}}.bin {{.PLAY}}/examples/{{.ITEM}}/
          src=examples/{{.ITEM}}; [ -d "$src" ] || src=docs/tutorial/{{.ITEM}}
          if [ -d "$src/data" ]; then cp -R "$src/data" {{.PLAY}}/examples/{{.ITEM}}/; fi
      - |
        {
          printf '['
          sep=''
          for name in {{.EXAMPLES | splitLines | join " "}}; do
            src=examples/$name; [ -d "$src" ] || src=docs/tutorial/$name
            data=
            if [ -d "$src/data" ]; then data=$(cd "$src" && find data -type f | LC_ALL=C sort | sed 's/.*/"&"/' | paste -sd, - | sed 's/,/, /g'); fi
            printf '%s\n  {"name": "%s", "cue": "examples/%s/%s.cue", "data": [%s]}' "$sep" "$name" "$name" "$name" "$data"
            sep=','
          done
          printf '\n]\n'
        } > {{.PLAY}}/examples.json
      - GOEXPERIMENT=simd GOOS=js GOARCH=wasm go build -trimpath -ldflags=-s -o {{.PLAY}}/psx.wasm ./web
      - cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" {{.PLAY}}/
      - touch {{.SITE}}/.nojekyll

  # Builds the compiler the playground runs in the browser, TinyGo compiled
  # to WebAssembly with LLVM and lld linked in, onto .build/compiler. It
  # needs a checkout of the TinyGo fork in TINYGO_SRC, to which it applies
  # web/compiler/tinygo-wasm.patch in a copy, and nix, and takes most of
  # an hour, so it is not part of site; web/compiler/build.sh says how it
  # works.
  compiler:
    cmds:
      - TINYGO_SRC="${TINYGO_SRC:-$HOME/src/ChrisRx/tinygo}" web/compiler/build.sh .build/compiler

  # Adds the playground to the built site: the compiler from the compiler
  # task, the disc tools, discgen and gofmt compiled to WebAssembly, and the
  # sysroot, the standard library and psx packages the examples use
  # together with the target files and the compiler's cache, packed for the
  # compiler to read.
  # tinygo-sysroot comes from the patched TinyGo tree the compiler task
  # leaves in .build/compiler/tinygo; wasmtime runs the compiler to fill
  # the cache.
  playground:
    vars:
      PLAY: .build/site/play
      TREE: .build/compiler/tinygo
    cmds:
      # The patched TinyGo tree's tinygo-sysroot, built here when the
      # compiler task has not: it links LLVM, so it builds in the
      # playground shell.
      - test -x {{.TREE}}/build/tinygo-sysroot || (cd {{.TREE}} && GOFLAGS=-mod=mod go build -tags llvm22 -ldflags "-X github.com/tinygo-org/tinygo/goenv.clangResourceDir=$(clang-22 -print-resource-dir)" -o build/tinygo-sysroot ./cmd/tinygo-sysroot)
      - mkdir -p {{.PLAY}}/tools
      - cp .build/compiler/tinygo.wasm {{.PLAY}}/tinygo.wasm
      - for: [discgen, mips1fix, eco2exe, mkpsxiso]
        cmd: GOOS=wasip1 GOARCH=wasm go build -trimpath -ldflags=-s -o {{.PLAY}}/tools/{{.ITEM}}.wasm ./tools/{{.ITEM}}
      # gofmt, for the playground's Format button and to format on Run.
      - GOOS=wasip1 GOARCH=wasm go build -trimpath -ldflags=-s -o {{.PLAY}}/tools/gofmt.wasm cmd/gofmt
      - rm -rf .build/sysroot
      - '{{.TREE}}/build/tinygo-sysroot -target=playstation-yaroze -o .build/sysroot ./examples/... ./docs/tutorial/hello'
      # The shipped compiler has no clang, so the full one runs here over
      # every example to fill the cache with the target's C and the
      # standard library.
      - web/compiler/mkcache.sh .build/compiler/tinygo-full.wasm .build/compiler/tinygo.wasm .build/sysroot $(cd .build/sysroot && ls -d mod/go.chrisrx.dev/psx/examples/*/ mod/go.chrisrx.dev/psx/docs/tutorial/hello/ | grep -v /internal/)
      - tar --format=ustar -C .build -cf - sysroot | gzip -9 > {{.PLAY}}/sysroot.tar.gz

  # Renders the documentation alone into .build/site, over whatever is
  # there, which is enough to look at a page while writing it.
  site:docs:
    cmds:
      - go run ./web/site -out .build/site

  # Serves .build/site on localhost:8000 to try the site.
  site:serve:
    cmds:
      - go run ./web/serve -dir .build/site

  examples:check:
    cmds:
      - mkdir -p tmp
      - defer: rm -rf tmp
      - tinygo build -target=playstation-yaroze -o tmp/prog.elf ./examples/check
      - go tool mips1fix tmp/prog.elf
      - |
        LIBPS=$(mipsel-none-elf-size -A tmp/prog.elf | awk '$1 == ".libps" { print $2; exit }')
        mipsel-none-elf-size tmp/prog.elf | awk -v window="${LIBPS:-0}" '
          NR == 1 { print "   text\t   data\t    bss\t    dec"; next }
          { text = $1 - window
            printf "%7d\t%7d\t%7d\t%7d\n", text, $2, $3, text + $2 + $3 }'
      - go tool eco2exe tmp/prog.elf tmp/prog.exe
      - go tool mkpsxiso -o tmp/check.bin --volume-id check.exe --boot MAIN.EXE --file MAIN.EXE=tmp/prog.exe --src examples/check
      - psxe -a -b emu/openbios/openbios.bin -L5 tmp/check.cue

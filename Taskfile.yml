version: '3'

# Most tasks here name what they read (sources) and what they write
# (generates), so that task skips them when nothing they read has changed
# since they last ran; task serve builds the whole site that way and serves
# it. The fingerprints are kept under .task/, which git ignores. A task
# whose outputs are large, such as the discs, is still skipped in a moment.

tasks:
  test:
    cmds:
      - go vet ./...
      - go test ./...

  # Runs the example programs in the emulator, from the tests package. It
  # needs a BIOS, from PSX_BIOS or the OpenBIOS image the site ships, and
  # builds the discs with TinyGo, so it runs in the default dev shell rather
  # than the ci one. The memory card test drives Sony's shell, which OpenBIOS
  # does not have, and runs only with Sony's BIOS in PSX_SONY_BIOS.
  test:emu:
    cmds:
      - task: build:discs
      - task: build:disc:tutorial
      - task: build:hot
      - go test -v ./tests/... ./internal/hot

  # Builds every example's disc, each onto .build/NAME/NAME.cue: every
  # directory under examples with a main.go, since examples/internal holds
  # what they share and is not one. The tutorial's disc goes first, on its
  # own, so that the compiler is unpacked and compiled for the runtime
  # once, rather than by every build at the same time; the rest then run
  # in parallel, as many at once as task -C allows, which CI limits to the
  # runner's cores.
  build:discs:
    deps:
      - build:disc:tutorial
    cmds:
      - task: build:discs:examples

  build:discs:examples:
    internal: true
    deps:
      - for: { var: EXAMPLES }
        task: build:disc
        vars: { NAME: '{{.ITEM}}' }
    vars:
      EXAMPLES:
        sh: for f in examples/*/main.go; do basename "$(dirname "$f")"; done

  # Builds the program in DIR, examples/NAME unless told otherwise, onto
  # .build/NAME/NAME.cue with yaroze, with the files it registers, which yaroze
  # reads out of the executable and takes from DIR, and keeps the ELF in
  # prog.elf for its symbols, which the emulator tests read. The output
  # directory starts with a dot so that go list ./... leaves it alone. The
  # build optimizes for speed, OPT=2, since a game's frame has a budget;
  # OPT=z is TinyGo's own default, for size.
  #
  # It is skipped when neither the program nor the packages a program may
  # use nor yaroze has changed since it last ran.
  build:disc:
    label: 'disc:{{.NAME}}'
    requires:
      vars: [NAME]
    vars:
      DIR: '{{.DIR | default (printf "examples/%s" .NAME)}}'
      OPT: '{{.OPT | default "2"}}'
    sources:
      - '{{.DIR}}/**/*'
      - 'yaroze/**/*.go'
      - 'disc/**/*.go'
      - 'archive/**/*.go'
      - 'scene/**/*.go'
      - 'format/**/*.go'
      - 'examples/internal/**/*.go'
      - 'internal/**/*'
      - 'cmd/yaroze/**/*'
      - 'link/**/*'
      - 'tools/**/*.go'
      - go.mod
      - go.sum
    generates:
      - '.build/{{.NAME}}/{{.NAME}}.cue'
      - '.build/{{.NAME}}/{{.NAME}}.bin'
      - '.build/{{.NAME}}/prog.elf'
    cmds:
      - rm -rf .build/{{.NAME}}
      - mkdir -p .build/{{.NAME}}
      - go run ./cmd/yaroze disc --opt={{.OPT}} --elf .build/{{.NAME}}/prog.elf -o .build/{{.NAME}}/{{.NAME}}.bin ./{{.DIR}}

  # Builds the hot reload test's fixtures onto .build/hot: v1 with --hot
  # onto a disc, with its ELF, and v2's patch against that ELF, which the
  # test in internal/hot applies to v1 while it runs.
  build:hot:
    sources:
      - 'internal/hot/testdata/**/*'
      - 'yaroze/**/*.go'
      - 'internal/**/*'
      - 'cmd/yaroze/**/*.go'
      - 'link/**/*'
    generates:
      - .build/hot/v1.cue
      - .build/hot/prog.elf
      - .build/hot/v2.patch.elf
    cmds:
      - rm -rf .build/hot
      - mkdir -p .build/hot
      - go run ./cmd/yaroze disc --hot --opt=2 --elf .build/hot/prog.elf -o .build/hot/v1.bin ./internal/hot/testdata/v1
      - go run ./cmd/yaroze patch --opt=2 --base .build/hot/prog.elf -o .build/hot/v2.patch.elf ./internal/hot/testdata/v2

  # Builds the tutorial's first program onto .build/hello/hello.cue, so
  # that it runs on its page like the examples and in the emulator tests.
  # The rest of the tutorial writes the square example.
  build:disc:tutorial:
    cmds:
      - task: build:disc
        vars: { NAME: hello, DIR: docs/tutorial/hello }

  # Builds the program in DIR, examples/NAME unless told otherwise, onto a
  # disc and runs it in a window with yaroze run, booting OpenBIOS. Flags
  # after -- go to yaroze run: task play NAME=check -- --mute
  play:
    requires:
      vars: [NAME]
    vars:
      DIR: '{{.DIR | default (printf "examples/%s" .NAME)}}'
    cmds:
      - go run ./cmd/yaroze run {{.CLI_ARGS}} ./{{.DIR}}

  # Builds whatever has changed of the site and the playground, and serves
  # the site on localhost:8000. The playground needs the compiler from
  # task compiler, which takes most of an hour and is not built here; see
  # compiler:check.
  serve:
    desc: Build what has changed and serve the site on localhost:8000
    cmds:
      - task: site
      - task: playground
      - go run ./web/serve -dir .build/site

  # Builds the site into .build/site: the documentation from docs/ and the
  # examples' package comments, rendered by web/site, and under play/ the
  # playground and the player from web/static, the api.json the
  # playground's completion reads and the starters it begins a project
  # from, also written by web/site, the OpenBIOS image the examples boot
  # with from emu/openbios, every example's disc and the tutorial's, and
  # the emulator compiled to WebAssembly from web/. Each part is skipped
  # when what it reads has not changed; task site:clean starts over.
  # Sony's BIOS must never be copied in.
  #
  # .github/workflows/pages.yml publishes this directory to GitHub Pages
  # as the workflow's artifact, so it is never committed here.
  site:
    desc: Build what has changed of the site into .build/site
    cmds:
      - task: build:discs
      - task: build:disc:tutorial
      - task: site:docs
      - task: site:play
      - task: site:emu

  # Removes the built site and the fingerprints, for a build from nothing.
  site:clean:
    cmds:
      - rm -rf .build/site .task

  # Renders the documentation and copies the playground's page into
  # .build/site, over whatever is there, which is enough to look at a page
  # while writing it.
  site:docs:
    sources:
      - 'docs/**/*'
      - 'examples/*/main.go'
      - 'examples/*/scenes/*.json'
      - 'examples/*/assets/**/*'
      - 'examples/*/pack/**/*'
      - 'web/site/**/*'
      - 'web/static/**/*'
      - 'yaroze/**/*.go'
    generates:
      - .build/site/index.html
      - .build/site/play/index.html
      - .build/site/play/api.json
      - .build/site/play/starters.json
    cmds:
      - go run ./web/site -out .build/site

  # The player's files beside the page: the BIOS, each example's disc and
  # its assets as well, which the playground offers to start a
  # program from, and examples.json listing them.
  site:play:
    vars:
      PLAY: .build/site/play
      EXAMPLES:
        # Every directory under examples with a main.go; examples/internal
        # holds what they share, and is not one. The tutorial's first
        # program joins them.
        sh: for f in examples/*/main.go; do basename "$(dirname "$f")"; done; echo hello
    sources:
      - 'emu/openbios/*'
      - '.build/*/*.cue'
      - '.build/*/*.bin'
      - 'examples/*/assets/**/*'
      - 'docs/tutorial/*/assets/**/*'
    generates:
      - '{{.PLAY}}/examples.json'
      - '{{.PLAY}}/openbios.bin'
    cmds:
      - mkdir -p {{.PLAY}}/examples
      - cp emu/openbios/openbios.bin licenses/OPENBIOS-LICENSE.txt {{.PLAY}}/
      - for: { var: EXAMPLES }
        cmd: |
          mkdir -p {{.PLAY}}/examples/{{.ITEM}}
          cp .build/{{.ITEM}}/{{.ITEM}}.cue .build/{{.ITEM}}/{{.ITEM}}.bin {{.PLAY}}/examples/{{.ITEM}}/
          src=examples/{{.ITEM}}; [ -d "$src" ] || src=docs/tutorial/{{.ITEM}}
          rm -rf {{.PLAY}}/examples/{{.ITEM}}/data {{.PLAY}}/examples/{{.ITEM}}/assets
          if [ -d "$src/assets" ]; then cp -R "$src/assets" {{.PLAY}}/examples/{{.ITEM}}/; fi
      - |
        {
          printf '['
          sep=''
          for name in {{.EXAMPLES | splitLines | join " "}}; do
            src=examples/$name; [ -d "$src" ] || src=docs/tutorial/$name
            assets=
            if [ -d "$src/assets" ]; then assets=$(cd "$src" && find assets -type f | LC_ALL=C sort | sed 's/.*/"&"/' | paste -sd, - | sed 's/,/, /g'); fi
            printf '%s\n  {"name": "%s", "cue": "examples/%s/%s.cue", "assets": [%s]}' "$sep" "$name" "$name" "$name" "$assets"
            sep=','
          done
          printf '\n]\n'
        } > {{.PLAY}}/examples.json

  # The emulator compiled to WebAssembly, with the loader Go ships.
  site:emu:
    sources:
      - 'emu/**/*.go'
      - 'web/*.go'
      - 'format/**/*.go'
      - 'internal/**/*.go'
      - go.mod
      - go.sum
    generates:
      - .build/site/play/psx.wasm
      - .build/site/play/wasm_exec.js
    cmds:
      - mkdir -p .build/site/play
      - GOEXPERIMENT=simd GOOS=js GOARCH=wasm go build -trimpath -ldflags=-s -o .build/site/play/psx.wasm ./web
      # The loader comes from a GOROOT that may be read-only, as Nix's is,
      # and a copy of it is then read-only too, which a second cp cannot
      # write over; install gives the copy its own mode.
      - install -m 644 "$(go env GOROOT)/lib/wasm/wasm_exec.js" .build/site/play/wasm_exec.js

  # Serves .build/site on localhost:8000 as it is, without building.
  site:serve:
    cmds:
      - go run ./web/serve -dir .build/site

  # Builds the compiler the playground runs in the browser, TinyGo compiled
  # to WebAssembly with LLVM and lld linked in, onto .build/compiler, from
  # the TinyGo the flake builds with web/compiler/tinygo-wasm.patch
  # applied. It needs nix and takes most of an hour, so it is not part of
  # site; web/compiler/build.sh says how it works.
  compiler:
    cmds:
      - web/compiler/build.sh .build/compiler

  # Publishes the compiler in .build/compiler as the release CI downloads
  # (web/compiler/release.sh), named by the recipe's key, so that pushing a
  # change to the recipe does not have CI spend hours building it again.
  # The build has to be of the recipe as it is now, which build.sh records
  # in .build/compiler/key. The release's tag is made at TARGET, main
  # unless told otherwise. Needs gh, logged in.
  compiler:release:
    cmds:
      - task: compiler:check
      - |
        want=$(web/compiler/key.sh)
        have=$(cat .build/compiler/key 2>/dev/null || echo none)
        if [ "$have" != "$want" ]; then
          echo "The compiler in .build/compiler is of recipe $have, not $want; build it again with:" >&2
          echo "  task compiler" >&2
          exit 1
        fi
      - web/compiler/release.sh .build/compiler

  # Puts the compiler yaroze embeds, cmd/yaroze/wasm/tinygo.wasm.gz, in
  # .build/compiler as tinygo.wasm, for the playground, unless the
  # compiler task has built one there, which has the full compiler beside
  # it and is left alone.
  compiler:embedded:
    sources:
      - cmd/yaroze/wasm/tinygo.wasm.gz
    generates:
      - .build/compiler/tinygo.wasm
    cmds:
      - mkdir -p .build/compiler
      - test -f .build/compiler/tinygo-full.wasm || gunzip -c cmd/yaroze/wasm/tinygo.wasm.gz > .build/compiler/tinygo.wasm

  # Says how to get the full compiler when .build/compiler has none, for
  # what needs its clang: task compiler builds it, or another checkout's
  # build can be linked in.
  compiler:check:
    silent: true
    cmds:
      - |
        if [ ! -f .build/compiler/tinygo.wasm ]; then
          echo "The playground needs the compiler in .build/compiler, which takes most of an hour to build:" >&2
          echo "  nix develop .#playground --command task compiler" >&2
          echo "or link another checkout's build in:" >&2
          echo "  ln -s /path/to/psxsdk/.build/compiler .build/compiler" >&2
          exit 1
        fi

  # Adds the playground to the built site: the compiler, the disc tools,
  # the converters, discgen and gofmt compiled to WebAssembly, and the
  # sysroot, the standard library and psx packages the examples use
  # together with the target files and the compiler's cache, packed for
  # the compiler to read. Each part is skipped when what it reads has not
  # changed; the sysroot and its cache take minutes.
  #
  # The compiler is the one in .build/compiler when the compiler task has
  # built one, and otherwise the one yaroze embeds, which is the same
  # compiler committed, so that the site builds from a checkout alone, as
  # it does on CI.
  playground:
    desc: Add what has changed of the playground to the built site
    cmds:
      - task: compiler:embedded
      - task: playground:compiler
      - task: playground:tools
      - task: playground:sysroot

  playground:compiler:
    sources:
      - .build/compiler/tinygo.wasm
    generates:
      - .build/site/play/tinygo.wasm
    cmds:
      - mkdir -p .build/site/play
      - cp .build/compiler/tinygo.wasm .build/site/play/tinygo.wasm

  # The disc tools, the converters the page runs from a program's
  # go:generate lines, and gofmt, for the playground's Format button and
  # to format on Run.
  playground:tools:
    cmds:
      - for: [discgen, mips1fix, eco2exe, mkdisc, png2tim, obj2tmd, wav2vag, mkvab, smf2seq, mkscene, mkarc]
        task: playground:tool
        vars: { NAME: '{{.ITEM}}' }
      - task: playground:gofmt

  playground:tool:
    label: 'playground:tool:{{.NAME}}'
    requires:
      vars: [NAME]
    sources:
      - 'tools/{{.NAME}}/**/*.go'
      - 'format/**/*.go'
      - 'internal/**/*.go'
      - 'disc/**/*.go'
      - 'archive/**/*.go'
      - 'link/**/*'
      - go.mod
      - go.sum
    generates:
      - '.build/site/play/tools/{{.NAME}}.wasm'
    cmds:
      - mkdir -p .build/site/play/tools
      - GOOS=wasip1 GOARCH=wasm go build -trimpath -ldflags=-s -o .build/site/play/tools/{{.NAME}}.wasm ./tools/{{.NAME}}

  playground:gofmt:
    status:
      - test -f .build/site/play/tools/gofmt.wasm
    cmds:
      - mkdir -p .build/site/play/tools
      - GOOS=wasip1 GOARCH=wasm go build -trimpath -ldflags=-s -o .build/site/play/tools/gofmt.wasm cmd/gofmt

  # The sysroot: tinygo-sysroot, from the patched TinyGo tree the compiler
  # task or web/compiler/prepare.sh leaves in .build/compiler/tinygo,
  # gathers the merged GOROOT, the psx packages and the target files; then
  # a compiler runs under wasmtime over every example to fill the cache
  # with the target's C and the standard library, at -opt=z, the level the
  # playground builds at. With the full compiler built, the one with
  # clang, that is it; with only the embedded one, which has no clang, the
  # compiled C and assembly come from the sysroot yaroze embeds, and the
  # compiler makes the rest. It is skipped when no Go package an example
  # may use, no example, neither compiler nor the embedded sysroot has
  # changed.
  playground:sysroot:
    vars:
      TREE: .build/compiler/tinygo
    sources:
      - '**/*.go'
      - 'docs/tutorial/hello/**/*'
      - 'examples/*/assets/**/*'
      - 'examples/*/pack/**/*'
      - .build/compiler/tinygo.wasm
      - .build/compiler/tinygo-full.wasm
      - cmd/yaroze/wasm/sysroot.tar.gz
      - web/compiler/mkcache.sh
      - go.mod
      - go.sum
      - exclude: 'web/**'
      - exclude: 'tests/**'
      - exclude: 'emu/**'
      - exclude: 'cmd/**'
      - exclude: 'tools/**'
      - exclude: 'internal/toolchain/**'
    generates:
      - .build/site/play/sysroot.tar.gz
    cmds:
      # The patched TinyGo tree's tinygo-sysroot, built here when the
      # compiler task has not: it links LLVM, so it builds in the
      # playground shell.
      - test -x {{.TREE}}/build/tinygo-sysroot || (cd {{.TREE}} && GOFLAGS=-mod=mod go build -tags llvm22 -ldflags "-X github.com/tinygo-org/tinygo/goenv.clangResourceDir=$(clang-22 -print-resource-dir)" -o build/tinygo-sysroot ./cmd/tinygo-sysroot)
      - rm -rf .build/sysroot
      - '{{.TREE}}/build/tinygo-sysroot -target=playstation-yaroze -o .build/sysroot ./examples/... ./docs/tutorial/hello'
      - |
        programs=$(cd .build/sysroot && ls -d mod/go.chrisrx.dev/psx/examples/*/ mod/go.chrisrx.dev/psx/docs/tutorial/hello/ | grep -v /internal/)
        if [ -f .build/compiler/tinygo-full.wasm ]; then
          web/compiler/mkcache.sh .build/compiler/tinygo-full.wasm .build/compiler/tinygo.wasm .build/sysroot $programs
        else
          rm -rf .build/seed && mkdir -p .build/seed
          tar -xzf cmd/yaroze/wasm/sysroot.tar.gz -C .build/seed --wildcards 'sysroot/cache/obj-*.bc' 'sysroot/cache/dep-*.json'
          OBJ_CACHE=.build/seed/sysroot/cache web/compiler/mkcache.sh .build/compiler/tinygo.wasm .build/compiler/tinygo.wasm .build/sysroot $programs
        fi
      - mkdir -p .build/site/play
      - tar --format=ustar -C .build -cf - sysroot | gzip -9 > .build/site/play/sysroot.tar.gz

  # Refreshes the compiler yaroze has built in, and builds yaroze onto
  # .build/yaroze: the compiler from the compiler task, and a sysroot of its
  # own, a copy of the one the playground:sysroot task leaves in
  # .build/sysroot with the cache filled at -opt=2 as well, the level yaroze
  # builds at by default, which the playground's leaves out to stay small.
  # Both are written under cmd/yaroze/wasm, which is committed so that go run
  # of yaroze works from the module.
  yaroze:
    vars:
      SYSROOT: .build/yaroze-sysroot
    cmds:
      - task: compiler:check
      - task: playground:sysroot
      - rm -rf {{.SYSROOT}}
      - cp -R .build/sysroot {{.SYSROOT}}
      - OPTS=2 web/compiler/mkcache.sh .build/compiler/tinygo-full.wasm .build/compiler/tinygo.wasm {{.SYSROOT}} $(cd {{.SYSROOT}} && ls -d mod/go.chrisrx.dev/psx/examples/*/ mod/go.chrisrx.dev/psx/docs/tutorial/hello/ | grep -v /internal/)
      - mkdir -p cmd/yaroze/wasm
      - gzip -9 -n -c .build/compiler/tinygo.wasm > cmd/yaroze/wasm/tinygo.wasm.gz
      # The archive's directory is sysroot, as the playground's is.
      - tar --format=ustar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner --mode=go-w -C .build --transform 's,^yaroze-sysroot,sysroot,' -cf - yaroze-sysroot | gzip -9 -n > cmd/yaroze/wasm/sysroot.tar.gz
      - go build -trimpath -ldflags=-s -o .build/yaroze ./cmd/yaroze

  # The compression benchmark behind docs/architecture/compression.md: packs
  # three of the examples' files with deflate and LZ4, builds the program
  # that unpacks them onto a disc, and times both decoders on the emulated
  # console. The test prints each decoder's speed.
  bench:compress:
    vars:
      DATA: internal/compressbench/data
    cmds:
      - go run ./internal/compressbench/gen {{.DATA}} examples/dino/assets/CASTLE.TIM examples/dogtale/assets/DOG.DAT examples/dino/assets/MD0.TMD
      - cd internal/compressbench && go run go.chrisrx.dev/psx/tools/discgen data
      - task: build:disc
        vars: { NAME: compressbench, DIR: internal/compressbench }
      - go test ./tests -run TestCompressionBench -v | grep -E 'KB/s|ok|FAIL'

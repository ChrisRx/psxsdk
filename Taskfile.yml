version: '3'

tasks:
  test:
    cmds:
      - go test $(go list ./... | grep -v examples)

  # Runs the example programs in the emulator, from the tests package. It
  # needs a BIOS, from PSX_BIOS or the OpenBIOS image the site ships, and
  # builds the discs with TinyGo, so it runs in the default dev shell rather
  # than the ci one. The memory card test drives Sony's shell, which OpenBIOS
  # does not have, and runs only with Sony's BIOS in PSX_SONY_BIOS.
  test:emu:
    cmds:
      - task: discs
      - PSX_BIOS="${PSX_BIOS:-$PWD/web/static/openbios.bin}" PSX_DISCS="$PWD/.build" go test -v ./tests/...

  # Builds the check example onto .build/check/check.cue.
  disc:check:
    cmds:
      - task: disc
        vars: { NAME: check }

  # Builds every example's disc, each onto .build/NAME/NAME.cue: every
  # directory under examples with a main.go, since examples/internal holds
  # what they share and is not one.
  discs:
    vars:
      EXAMPLES:
        sh: for f in examples/*/main.go; do basename "$(dirname "$f")"; done
    cmds:
      - for: { var: EXAMPLES }
        task: disc
        vars: { NAME: '{{.ITEM}}' }

  # Builds the example NAME onto .build/NAME/NAME.cue, with the files in
  # its disc directory, if it has one. The directory starts with a dot so
  # that go list ./... leaves it alone.
  disc:
    requires:
      vars: [NAME]
    cmds:
      - rm -rf .build/{{.NAME}}
      - mkdir -p .build/{{.NAME}}/disc
      - if [ -d examples/{{.NAME}}/disc ]; then cp -r examples/{{.NAME}}/disc/. .build/{{.NAME}}/disc/; fi
      - tinygo build -target=playstation-yaroze -o .build/{{.NAME}}/prog.elf ./examples/{{.NAME}}
      - go tool mips1fix .build/{{.NAME}}/prog.elf
      - go tool eco2exe .build/{{.NAME}}/prog.elf .build/{{.NAME}}/prog.exe
      - cp .build/{{.NAME}}/prog.exe .build/{{.NAME}}/disc/MAIN.EXE
      - go tool mkpsxiso -o .build/{{.NAME}}/{{.NAME}}.bin --volume-id {{.NAME}}.exe --boot MAIN.EXE .build/{{.NAME}}/disc

  # Builds the site for GitHub Pages into docs/, replacing what is there:
  # every example's disc, the emulator compiled to WebAssembly from web/,
  # and the page around it, from web/static, which includes the OpenBIOS
  # image the examples boot with. Sony's BIOS must never be copied in.
  site:
    vars:
      EXAMPLES:
        # Every directory under examples with a main.go; examples/internal
        # holds what they share, and is not one.
        sh: for f in examples/*/main.go; do basename "$(dirname "$f")"; done
    cmds:
      - task: discs
      - rm -rf docs
      - mkdir -p docs/examples
      - for: { var: EXAMPLES }
        cmd: mkdir -p docs/examples/{{.ITEM}} && cp .build/{{.ITEM}}/{{.ITEM}}.cue .build/{{.ITEM}}/{{.ITEM}}.bin docs/examples/{{.ITEM}}/
      - |
        {
          printf '['
          sep=''
          for name in {{.EXAMPLES | splitLines | join " "}}; do
            printf '%s\n  {"name": "%s", "cue": "examples/%s/%s.cue"}' "$sep" "$name" "$name" "$name"
            sep=','
          done
          printf '\n]\n'
        } > docs/examples.json
      - GOEXPERIMENT=simd GOOS=js GOARCH=wasm go build -trimpath -ldflags=-s -o docs/psx.wasm ./web
      - cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" docs/
      - cp -r web/static/. docs/
      - touch docs/.nojekyll

  # Serves docs/ on localhost:8000 to try the site.
  site:serve:
    cmds:
      - go run ./web/serve -dir docs

  examples:check:
    cmds:
      - cp -r examples/check tmp
      - defer: rm -rf tmp
      - tinygo build -target=playstation-yaroze -o tmp/prog.elf ./examples/check
      - go tool mips1fix tmp/prog.elf
      - |
        LIBPS=$(mipsel-none-elf-size -A tmp/prog.elf | awk '$1 == ".libps" { print $2; exit }')
        mipsel-none-elf-size tmp/prog.elf | awk -v window="${LIBPS:-0}" '
          NR == 1 { print "   text\t   data\t    bss\t    dec"; next }
          { text = $1 - window
            printf "%7d\t%7d\t%7d\t%7d\n", text, $2, $3, text + $2 + $3 }'
      - go tool eco2exe tmp/prog.elf tmp/prog.exe
      - cp tmp/prog.exe tmp/disc/MAIN.EXE
      - go tool mkpsxiso -o tmp/check.bin --volume-id check.exe --boot MAIN.EXE tmp/disc
      - psxe -a -b web/static/openbios.bin -L5 tmp/check.cue

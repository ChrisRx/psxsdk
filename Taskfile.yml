version: '3'

# Most tasks here name what they read (sources) and what they write
# (generates), so that task skips them when nothing they read has changed
# since they last ran; task serve builds the whole site that way and serves
# it. The fingerprints are kept under .task/, which git ignores. A task
# whose outputs are large, such as the discs, is still skipped in a moment.

tasks:
  test:
    cmds:
      - go vet ./...
      - go test $(go list ./... | grep -v examples)

  # Runs the example programs in the emulator, from the tests package. It
  # needs a BIOS, from PSX_BIOS or the OpenBIOS image the site ships, and
  # builds the discs with TinyGo, so it runs in the default dev shell rather
  # than the ci one. The memory card test drives Sony's shell, which OpenBIOS
  # does not have, and runs only with Sony's BIOS in PSX_SONY_BIOS.
  test:emu:
    cmds:
      - task: discs
      - task: disc:tutorial
      - PSX_BIOS="${PSX_BIOS:-$PWD/emu/openbios/openbios.bin}" PSX_DISCS="$PWD/.build" go test -v ./tests/...

  # Builds whatever has changed of the site and the playground, and serves
  # the site on localhost:8000. The playground needs the compiler from
  # task compiler, which takes most of an hour and is not built here; see
  # compiler:check.
  serve:
    desc: Build what has changed and serve the site on localhost:8000
    cmds:
      - task: site
      - task: playground
      - go run ./web/serve -dir .build/site

  # Builds the check example onto .build/check/check.cue.
  disc:check:
    cmds:
      - task: disc
        vars: { NAME: check }

  # Builds every example's disc, each onto .build/NAME/NAME.cue: every
  # directory under examples with a main.go, since examples/internal holds
  # what they share and is not one.
  discs:
    vars:
      EXAMPLES:
        sh: for f in examples/*/main.go; do basename "$(dirname "$f")"; done
    cmds:
      - for: { var: EXAMPLES }
        task: disc
        vars: { NAME: '{{.ITEM}}' }

  # Builds the program in DIR, examples/NAME unless told otherwise, onto
  # .build/NAME/NAME.cue with nyc, with the files it registers, which nyc
  # reads out of the executable and takes from DIR, and keeps the ELF in
  # prog.elf for its symbols, which the emulator tests read. The output
  # directory starts with a dot so that go list ./... leaves it alone. The
  # build optimizes for speed, OPT=2, since a game's frame has a budget;
  # OPT=z is TinyGo's own default, for size. COMPILER=wasm builds with
  # TinyGo compiled to WebAssembly instead of the tinygo command, from
  # NYC_WASM.
  #
  # It is skipped when neither the program nor the packages a program may
  # use nor nyc has changed since it last ran.
  disc:
    label: 'disc:{{.NAME}}'
    requires:
      vars: [NAME]
    vars:
      DIR: '{{.DIR | default (printf "examples/%s" .NAME)}}'
      OPT: '{{.OPT | default "2"}}'
      COMPILER: '{{.COMPILER | default "auto"}}'
    sources:
      - '{{.DIR}}/**/*'
      - 'yaroze/**/*.go'
      - 'disc/**/*.go'
      - 'archive/**/*.go'
      - 'scene/**/*.go'
      - 'format/**/*.go'
      - 'examples/internal/**/*.go'
      - 'internal/**/*'
      - 'cmd/nyc/**/*.go'
      - 'link/**/*'
      - 'tools/**/*.go'
      - go.mod
      - go.sum
    generates:
      - '.build/{{.NAME}}/{{.NAME}}.cue'
      - '.build/{{.NAME}}/{{.NAME}}.bin'
      - '.build/{{.NAME}}/prog.elf'
    cmds:
      - rm -rf .build/{{.NAME}}
      - mkdir -p .build/{{.NAME}}
      - go run ./cmd/nyc disc --compiler={{.COMPILER}} --opt={{.OPT}} --elf .build/{{.NAME}}/prog.elf -o .build/{{.NAME}}/{{.NAME}}.bin ./{{.DIR}}

  # Builds the tutorial's first program onto .build/hello/hello.cue, so
  # that it runs on its page like the examples and in the emulator tests.
  # The rest of the tutorial writes the square example.
  disc:tutorial:
    cmds:
      - task: disc
        vars: { NAME: hello, DIR: docs/tutorial/hello }

  # Builds the program in DIR, examples/NAME unless told otherwise, onto a
  # disc and runs it in a window with nyc run, booting OpenBIOS. Flags
  # after -- go to nyc run: task play NAME=check -- --mute
  play:
    requires:
      vars: [NAME]
    vars:
      DIR: '{{.DIR | default (printf "examples/%s" .NAME)}}'
    cmds:
      - go run ./cmd/nyc run {{.CLI_ARGS}} ./{{.DIR}}

  # Builds the site into .build/site: the documentation from docs/ and the
  # examples' package comments, rendered by web/site, and under play/ the
  # playground and the player from web/static, the api.json the
  # playground's completion reads and the starters it begins a project
  # from, also written by web/site, the OpenBIOS image the examples boot
  # with from emu/openbios, every example's disc and the tutorial's, and
  # the emulator compiled to WebAssembly from web/. Each part is skipped
  # when what it reads has not changed; task site:clean starts over.
  # Sony's BIOS must never be copied in.
  #
  # .github/workflows/pages.yml publishes this directory to GitHub Pages
  # through the gh-pages branch, so it is never committed here. The
  # .nojekyll file keeps Pages from running the branch through Jekyll.
  site:
    desc: Build what has changed of the site into .build/site
    cmds:
      - task: discs
      - task: disc:tutorial
      - task: site:docs
      - task: site:play
      - task: site:emu

  # Removes the built site and the fingerprints, for a build from nothing.
  site:clean:
    cmds:
      - rm -rf .build/site .task

  # Renders the documentation and copies the playground's page into
  # .build/site, over whatever is there, which is enough to look at a page
  # while writing it.
  site:docs:
    sources:
      - 'docs/**/*'
      - 'examples/*/main.go'
      - 'examples/*/scenes/*.json'
      - 'examples/*/assets/**/*'
      - 'examples/*/pack/**/*'
      - 'web/site/**/*'
      - 'web/static/**/*'
      - 'yaroze/**/*.go'
    generates:
      - .build/site/index.html
      - .build/site/play/index.html
      - .build/site/play/api.json
      - .build/site/play/starters.json
    cmds:
      - go run ./web/site -out .build/site

  # The player's files beside the page: the BIOS, each example's disc and
  # its assets as well, which the playground offers to start a
  # program from, and examples.json listing them.
  site:play:
    vars:
      PLAY: .build/site/play
      EXAMPLES:
        # Every directory under examples with a main.go; examples/internal
        # holds what they share, and is not one. The tutorial's first
        # program joins them.
        sh: for f in examples/*/main.go; do basename "$(dirname "$f")"; done; echo hello
    sources:
      - 'emu/openbios/*'
      - '.build/*/*.cue'
      - '.build/*/*.bin'
      - 'examples/*/assets/**/*'
      - 'docs/tutorial/*/assets/**/*'
    generates:
      - '{{.PLAY}}/examples.json'
      - '{{.PLAY}}/openbios.bin'
    cmds:
      - mkdir -p {{.PLAY}}/examples
      - cp emu/openbios/openbios.bin emu/openbios/OPENBIOS-LICENSE.txt {{.PLAY}}/
      - for: { var: EXAMPLES }
        cmd: |
          mkdir -p {{.PLAY}}/examples/{{.ITEM}}
          cp .build/{{.ITEM}}/{{.ITEM}}.cue .build/{{.ITEM}}/{{.ITEM}}.bin {{.PLAY}}/examples/{{.ITEM}}/
          src=examples/{{.ITEM}}; [ -d "$src" ] || src=docs/tutorial/{{.ITEM}}
          rm -rf {{.PLAY}}/examples/{{.ITEM}}/data {{.PLAY}}/examples/{{.ITEM}}/assets
          if [ -d "$src/assets" ]; then cp -R "$src/assets" {{.PLAY}}/examples/{{.ITEM}}/; fi
      - |
        {
          printf '['
          sep=''
          for name in {{.EXAMPLES | splitLines | join " "}}; do
            src=examples/$name; [ -d "$src" ] || src=docs/tutorial/$name
            assets=
            if [ -d "$src/assets" ]; then assets=$(cd "$src" && find assets -type f | LC_ALL=C sort | sed 's/.*/"&"/' | paste -sd, - | sed 's/,/, /g'); fi
            printf '%s\n  {"name": "%s", "cue": "examples/%s/%s.cue", "assets": [%s]}' "$sep" "$name" "$name" "$name" "$assets"
            sep=','
          done
          printf '\n]\n'
        } > {{.PLAY}}/examples.json
      - touch .build/site/.nojekyll

  # The emulator compiled to WebAssembly, with the loader Go ships.
  site:emu:
    sources:
      - 'emu/**/*.go'
      - 'web/*.go'
      - 'format/**/*.go'
      - 'internal/**/*.go'
      - go.mod
      - go.sum
    generates:
      - .build/site/play/psx.wasm
      - .build/site/play/wasm_exec.js
    cmds:
      - mkdir -p .build/site/play
      - GOEXPERIMENT=simd GOOS=js GOARCH=wasm go build -trimpath -ldflags=-s -o .build/site/play/psx.wasm ./web
      # The loader comes from a GOROOT that may be read-only, as Nix's is,
      # and a copy of it is then read-only too, which a second cp cannot
      # write over; install gives the copy its own mode.
      - install -m 644 "$(go env GOROOT)/lib/wasm/wasm_exec.js" .build/site/play/wasm_exec.js

  # Serves .build/site on localhost:8000 as it is, without building.
  site:serve:
    cmds:
      - go run ./web/serve -dir .build/site

  # Builds the compiler the playground runs in the browser, TinyGo compiled
  # to WebAssembly with LLVM and lld linked in, onto .build/compiler. It
  # needs a checkout of the TinyGo fork in TINYGO_SRC, to which it applies
  # web/compiler/tinygo-wasm.patch in a copy, and nix, and takes most of
  # an hour, so it is not part of site; web/compiler/build.sh says how it
  # works.
  compiler:
    cmds:
      - TINYGO_SRC="${TINYGO_SRC:-$HOME/src/ChrisRx/tinygo}" web/compiler/build.sh .build/compiler

  # Says how to get the compiler when .build/compiler has none: task
  # compiler builds it, or another checkout's build can be linked in.
  compiler:check:
    silent: true
    cmds:
      - |
        if [ ! -f .build/compiler/tinygo.wasm ]; then
          echo "The playground needs the compiler in .build/compiler, which takes most of an hour to build:" >&2
          echo "  nix develop .#playground --command task compiler" >&2
          echo "or link another checkout's build in:" >&2
          echo "  ln -s /path/to/psxsdk/.build/compiler .build/compiler" >&2
          exit 1
        fi

  # Adds the playground to the built site: the compiler from the compiler
  # task, the disc tools, the converters, discgen and gofmt compiled to
  # WebAssembly, and the sysroot, the standard library and psx packages
  # the examples use together with the target files and the compiler's
  # cache, packed for the compiler to read. Each part is skipped when what
  # it reads has not changed; the sysroot and its cache take minutes.
  playground:
    desc: Add what has changed of the playground to the built site
    cmds:
      - task: compiler:check
      - task: playground:compiler
      - task: playground:tools
      - task: playground:sysroot

  playground:compiler:
    sources:
      - .build/compiler/tinygo.wasm
    generates:
      - .build/site/play/tinygo.wasm
    cmds:
      - mkdir -p .build/site/play
      - cp .build/compiler/tinygo.wasm .build/site/play/tinygo.wasm

  # The disc tools, the converters the page runs from a program's
  # go:generate lines, and gofmt, for the playground's Format button and
  # to format on Run.
  playground:tools:
    cmds:
      - for: [discgen, mips1fix, eco2exe, mkpsxiso, png2tim, obj2tmd, wav2vag, mkvab, smf2seq, mkscene, mkarc]
        task: playground:tool
        vars: { NAME: '{{.ITEM}}' }
      - task: playground:gofmt

  playground:tool:
    label: 'playground:tool:{{.NAME}}'
    requires:
      vars: [NAME]
    sources:
      - 'tools/{{.NAME}}/**/*.go'
      - 'format/**/*.go'
      - 'internal/**/*.go'
      - 'disc/**/*.go'
      - 'archive/**/*.go'
      - 'link/**/*'
      - go.mod
      - go.sum
    generates:
      - '.build/site/play/tools/{{.NAME}}.wasm'
    cmds:
      - mkdir -p .build/site/play/tools
      - GOOS=wasip1 GOARCH=wasm go build -trimpath -ldflags=-s -o .build/site/play/tools/{{.NAME}}.wasm ./tools/{{.NAME}}

  playground:gofmt:
    status:
      - test -f .build/site/play/tools/gofmt.wasm
    cmds:
      - mkdir -p .build/site/play/tools
      - GOOS=wasip1 GOARCH=wasm go build -trimpath -ldflags=-s -o .build/site/play/tools/gofmt.wasm cmd/gofmt

  # The sysroot: tinygo-sysroot, from the patched TinyGo tree the compiler
  # task leaves in .build/compiler/tinygo, gathers the merged GOROOT, the
  # psx packages and the target files; then the full compiler, which has
  # clang where the shipped one does not, runs under wasmtime over every
  # example to fill the cache with the target's C and the standard
  # library, at -opt=z, the level the playground builds at. It is skipped
  # when no Go package an example may use, no example and neither compiler
  # has changed.
  playground:sysroot:
    vars:
      TREE: .build/compiler/tinygo
    sources:
      - '**/*.go'
      - 'docs/tutorial/hello/**/*'
      - 'examples/*/assets/**/*'
      - 'examples/*/pack/**/*'
      - .build/compiler/tinygo.wasm
      - .build/compiler/tinygo-full.wasm
      - web/compiler/mkcache.sh
      - go.mod
      - go.sum
      - exclude: 'web/**'
      - exclude: 'tests/**'
      - exclude: 'emu/**'
      - exclude: 'cmd/**'
      - exclude: 'tools/**'
      - exclude: 'internal/toolchain/**'
    generates:
      - .build/site/play/sysroot.tar.gz
    cmds:
      # The patched TinyGo tree's tinygo-sysroot, built here when the
      # compiler task has not: it links LLVM, so it builds in the
      # playground shell.
      - test -x {{.TREE}}/build/tinygo-sysroot || (cd {{.TREE}} && GOFLAGS=-mod=mod go build -tags llvm22 -ldflags "-X github.com/tinygo-org/tinygo/goenv.clangResourceDir=$(clang-22 -print-resource-dir)" -o build/tinygo-sysroot ./cmd/tinygo-sysroot)
      - rm -rf .build/sysroot
      - '{{.TREE}}/build/tinygo-sysroot -target=playstation-yaroze -o .build/sysroot ./examples/... ./docs/tutorial/hello'
      - web/compiler/mkcache.sh .build/compiler/tinygo-full.wasm .build/compiler/tinygo.wasm .build/sysroot $(cd .build/sysroot && ls -d mod/go.chrisrx.dev/psx/examples/*/ mod/go.chrisrx.dev/psx/docs/tutorial/hello/ | grep -v /internal/)
      - mkdir -p .build/site/play
      - tar --format=ustar -C .build -cf - sysroot | gzip -9 > .build/site/play/sysroot.tar.gz

  # Builds nycw onto .build/nycw, nyc with TinyGo compiled to WebAssembly
  # built in, so that it compiles programs with nothing else installed: the
  # compiler from the compiler task, and a sysroot of its own, a copy of
  # the one the playground:sysroot task leaves in .build/sysroot with the
  # cache filled at -opt=2 as well, the level nyc builds at by default,
  # which the playground's leaves out to stay small. Both are written
  # under cmd/nycw/wasm, which is committed so that go run of nycw works
  # from the module.
  nyc:
    vars:
      SYSROOT: .build/nyc-sysroot
    cmds:
      - task: compiler:check
      - task: playground:sysroot
      - rm -rf {{.SYSROOT}}
      - cp -R .build/sysroot {{.SYSROOT}}
      - OPTS=2 web/compiler/mkcache.sh .build/compiler/tinygo-full.wasm .build/compiler/tinygo.wasm {{.SYSROOT}} $(cd {{.SYSROOT}} && ls -d mod/go.chrisrx.dev/psx/examples/*/ mod/go.chrisrx.dev/psx/docs/tutorial/hello/ | grep -v /internal/)
      - mkdir -p cmd/nycw/wasm
      - gzip -9 -n -c .build/compiler/tinygo.wasm > cmd/nycw/wasm/tinygo.wasm.gz
      # The archive's directory is sysroot, as the playground's is.
      - tar --format=ustar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner --mode=go-w -C .build --transform 's,^nyc-sysroot,sysroot,' -cf - nyc-sysroot | gzip -9 -n > cmd/nycw/wasm/sysroot.tar.gz
      - go build -trimpath -ldflags=-s -o .build/nycw ./cmd/nycw

  # The compression benchmark behind docs/topics/compression.md: packs
  # three of the examples' files with deflate and LZ4, builds the program
  # that unpacks them onto a disc, and times both decoders on the emulated
  # console. The test prints each decoder's speed.
  bench:compress:
    vars:
      DATA: internal/compressbench/data
    cmds:
      - go run ./internal/compressbench/gen {{.DATA}} examples/dino/assets/CASTLE.TIM examples/dogtale/assets/DOG.DAT examples/dino/assets/MD0.TMD
      - cd internal/compressbench && go run go.chrisrx.dev/psx/tools/discgen data
      - task: disc
        vars: { NAME: compressbench, DIR: internal/compressbench }
      - PSX_BIOS=$PWD/emu/openbios/openbios.bin PSX_DISCS=$PWD/.build go test ./tests -run TestCompressionBench -v | grep -E 'KB/s|ok|FAIL'

  # Copies the files the TinyGo fork adds, the PlayStation targets and
  # their runtime, from its last commit in TINYGO_SRC into
  # internal/toolchain/_tinygo, which nyc lays over a TinyGo without them.
  # Run it when the fork's pin in flake.nix moves.
  nyc:fork:
    vars:
      DST: internal/toolchain/_tinygo
    cmds:
      - rm -rf {{.DST}}
      - |
        src="${TINYGO_SRC:-$HOME/src/ChrisRx/tinygo}"
        git -C "$src" diff --name-only --diff-filter=A HEAD~1 HEAD | while read -r f; do
          mkdir -p "{{.DST}}/$(dirname "$f")"
          git -C "$src" show "HEAD:$f" > "{{.DST}}/$f"
        done

  examples:check:
    cmds:
      - mkdir -p tmp
      - defer: rm -rf tmp
      - go run ./cmd/nyc disc --opt=z --elf tmp/prog.elf -o tmp/check.bin ./examples/check
      - mipsel-none-elf-size tmp/prog.elf
      - psxe -a -b emu/openbios/openbios.bin -L5 tmp/check.cue

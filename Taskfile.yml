version: '3'

tasks:
  test:
    cmds:
      - go test $(go list ./... | grep -v examples)

  # Runs the example programs in the emulator, from the tests package. It
  # needs a BIOS, from PSX_BIOS or the OpenBIOS image the site ships, and
  # builds the discs with TinyGo, so it runs in the default dev shell rather
  # than the ci one. The memory card test drives Sony's shell, which OpenBIOS
  # does not have, and runs only with Sony's BIOS in PSX_SONY_BIOS.
  test:emu:
    cmds:
      - task: discs
      - PSX_BIOS="${PSX_BIOS:-$PWD/web/static/openbios.bin}" PSX_DISCS="$PWD/.build" go test -v ./tests/...

  # Builds the check example onto .build/check/check.cue.
  disc:check:
    cmds:
      - task: disc
        vars: { NAME: check }

  # Builds every example's disc, each onto .build/NAME/NAME.cue: every
  # directory under examples with a main.go, since examples/internal holds
  # what they share and is not one.
  discs:
    vars:
      EXAMPLES:
        sh: for f in examples/*/main.go; do basename "$(dirname "$f")"; done
    cmds:
      - for: { var: EXAMPLES }
        task: disc
        vars: { NAME: '{{.ITEM}}' }

  # Builds the example NAME onto .build/NAME/NAME.cue, with the files its
  # program registers, which mkpsxiso reads out of the executable and takes
  # from the example's directory. The output directory starts with a dot so
  # that go list ./... leaves it alone.
  disc:
    requires:
      vars: [NAME]
    cmds:
      - rm -rf .build/{{.NAME}}
      - mkdir -p .build/{{.NAME}}
      - tinygo build -target=playstation-yaroze -o .build/{{.NAME}}/prog.elf ./examples/{{.NAME}}
      - go tool mips1fix .build/{{.NAME}}/prog.elf
      - go tool eco2exe .build/{{.NAME}}/prog.elf .build/{{.NAME}}/prog.exe
      - go tool mkpsxiso -o .build/{{.NAME}}/{{.NAME}}.bin --volume-id {{.NAME}}.exe --boot MAIN.EXE --file MAIN.EXE=.build/{{.NAME}}/prog.exe --src examples/{{.NAME}}

  # Builds the site into .build/site, replacing what is there: every
  # example's disc, the emulator compiled to WebAssembly from web/, and the
  # page around it, from web/static, which includes the OpenBIOS image the
  # examples boot with. Sony's BIOS must never be copied in.
  #
  # .github/workflows/pages.yml publishes this directory to GitHub Pages
  # through the gh-pages branch, so it is never committed here. The
  # .nojekyll file keeps Pages from running the branch through Jekyll.
  site:
    vars:
      SITE: .build/site
      EXAMPLES:
        # Every directory under examples with a main.go; examples/internal
        # holds what they share, and is not one.
        sh: for f in examples/*/main.go; do basename "$(dirname "$f")"; done
    cmds:
      - task: discs
      - rm -rf {{.SITE}}
      - mkdir -p {{.SITE}}/examples
      - for: { var: EXAMPLES }
        cmd: mkdir -p {{.SITE}}/examples/{{.ITEM}} && cp .build/{{.ITEM}}/{{.ITEM}}.cue .build/{{.ITEM}}/{{.ITEM}}.bin {{.SITE}}/examples/{{.ITEM}}/
      - |
        {
          printf '['
          sep=''
          for name in {{.EXAMPLES | splitLines | join " "}}; do
            printf '%s\n  {"name": "%s", "cue": "examples/%s/%s.cue"}' "$sep" "$name" "$name" "$name"
            sep=','
          done
          printf '\n]\n'
        } > {{.SITE}}/examples.json
      - GOEXPERIMENT=simd GOOS=js GOARCH=wasm go build -trimpath -ldflags=-s -o {{.SITE}}/psx.wasm ./web
      - cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" {{.SITE}}/
      - cp -r web/static/. {{.SITE}}/
      - touch {{.SITE}}/.nojekyll

  # Serves .build/site on localhost:8000 to try the site.
  site:serve:
    cmds:
      - go run ./web/serve -dir .build/site

  examples:check:
    cmds:
      - mkdir -p tmp
      - defer: rm -rf tmp
      - tinygo build -target=playstation-yaroze -o tmp/prog.elf ./examples/check
      - go tool mips1fix tmp/prog.elf
      - |
        LIBPS=$(mipsel-none-elf-size -A tmp/prog.elf | awk '$1 == ".libps" { print $2; exit }')
        mipsel-none-elf-size tmp/prog.elf | awk -v window="${LIBPS:-0}" '
          NR == 1 { print "   text\t   data\t    bss\t    dec"; next }
          { text = $1 - window
            printf "%7d\t%7d\t%7d\t%7d\n", text, $2, $3, text + $2 + $3 }'
      - go tool eco2exe tmp/prog.elf tmp/prog.exe
      - go tool mkpsxiso -o tmp/check.bin --volume-id check.exe --boot MAIN.EXE --file MAIN.EXE=tmp/prog.exe --src examples/check
      - psxe -a -b web/static/openbios.bin -L5 tmp/check.cue
